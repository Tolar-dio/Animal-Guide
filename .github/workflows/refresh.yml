name: Refresh data

# Weekly. Species lists, crosswalk, traits and iNaturalist's monthly modeled
# ranges first; then photos and Wikipedia text for each class in parallel
# (each class gets its own 6-hour job); then one commit and a redeploy.
on:
  schedule:
    - cron: "17 9 * * 0"   # Sundays 09:17 UTC (02:17 in Denver)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  lists:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - run: python pipeline/fetch_mdd.py
      - run: python pipeline/fetch_birds.py
      - run: python pipeline/fetch_reptiles.py
      - run: python pipeline/fetch_wikidata.py
      - run: python pipeline/fetch_traits.py
      - name: iNaturalist modeled ranges (monthly upstream)
        run: python pipeline/build_ranges_open.py inat
      - name: Audit modeled ranges against observations
        run: python pipeline/check_inat_ranges.py
      - uses: actions/upload-artifact@v4
        with: { name: data-lists, path: data, retention-days: 3 }

  media:
    needs: lists
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        cls: [mammals, birds, reptiles]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: data-lists, path: data }
      - name: iNaturalist photos
        run: python pipeline/fetch_inat.py ${{ matrix.cls }}
      - name: Commons and Wikipedia
        run: python pipeline/fetch_wikimedia.py ${{ matrix.cls }}
        continue-on-error: true   # keep last week's text if Wikimedia throttles us
      - uses: actions/upload-artifact@v4
        with:
          name: data-media-${{ matrix.cls }}
          retention-days: 3
          path: |
            data/media/${{ matrix.cls }}_*
            data/text/${{ matrix.cls }}_*

  commit:
    needs: [lists, media]
    if: always() && needs.lists.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: data-lists, path: data }
      - uses: actions/download-artifact@v4
        with: { pattern: data-media-*, path: data, merge-multiple: true }
      - name: Commit changed data
        run: |
          git config user.name "animal-guide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No data changes"; else
            git commit -m "Data refresh $(date -u +%F)"
            git push
          fi

  deploy:
    needs: commit
    uses: ./.github/workflows/deploy.yml

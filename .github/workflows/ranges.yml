name: Rebuild expert range hexagons

# Manual only. Expert range datasets are fixed releases, so this runs once,
# or when one is updated:
#   mdd   Marsh et al. 2022 mammal ranges (Zenodo 6644198), ~10 GB, ~1 hour
#   gard  GARD 1.7 reptile ranges (Zenodo 6499637), ~850 MB, ~20 minutes
# iNaturalist's modeled ranges refresh weekly in refresh.yml instead.
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Which dataset to rebuild"
        type: choice
        options: [gard, mdd, both]
        default: gard

permissions:
  contents: write

jobs:
  ranges:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - if: inputs.dataset == 'mdd' || inputs.dataset == 'both'
        run: python pipeline/build_ranges_h3.py --cache "$RUNNER_TEMP/ranges"
      - if: inputs.dataset == 'gard' || inputs.dataset == 'both'
        run: python pipeline/build_ranges_open.py gard
      - run: python pipeline/build_countries.py
      - name: Commit
        run: |
          git config user.name "animal-guide-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ranges
          git diff --cached --quiet || (git commit -m "Rebuild expert range hexagons" && git push)
